name: build kernel arm64
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  KBUILD_BUILD_USER: deepin-kernel-sig
  KBUILD_BUILD_HOST: deepin-kernel-builder
  email: support@deepin.org

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  build-kernel:
    runs-on: [self-hosted, linux, X64]
    steps:
      - uses: actions/checkout@v6
      - name: "Install Deps"
        run: |
          git config --global user.email $email
          git config --global user.name $KBUILD_BUILD_USER

      - name: "Compile kernel"
        run: |
          # .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- deepin_arm64_desktop_defconfig
          scripts/config --enable CONFIG_DEBUG_INFO_NONE
          scripts/config --disable CONFIG_DEBUG_INFO_DWARF5
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: 'Clang build kernel'
        run: |
          # .config
          make LLVM=-18 ARCH=arm64 deepin_arm64_desktop_defconfig
          scripts/config --enable CONFIG_DEBUG_INFO_NONE
          scripts/config --disable CONFIG_DEBUG_INFO_DWARF5
          make LLVM=-18 ARCH=arm64 olddefconfig
          make LLVM=-18 ARCH=arm64 -j$(nproc)
